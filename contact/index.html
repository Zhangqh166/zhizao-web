<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联系我们 · 执造咨询</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="/">执造 <span>ZHIZAO</span></a>
      <nav>
        <a href="/#services">服务</a>
        <a href="/#cases">案例</a>
        <a href="/about/">关于</a>
        <a href="/contact/">联系</a>
      </nav>
      <a class="btn" href="/contact/">预约沟通</a>
    </header>

    <section class="page-hero">
      <div class="section-title">CONTACT</div>
      <h1>先聊清楚，再动手。</h1>
      <div class="prose">
        <p>新店、老店改造、培训，都可以先丢一句话过来。邮箱：<strong>hello@zhizao.cn</strong>（可改）</p>
      </div>
      <form class="form" action="mailto:hello@zhizao.cn" method="post" enctype="text/plain">
        <label>怎么称呼
          <input name="name" placeholder="您的称呼" required />
        </label>
        <label>联系方式
          <input name="contact" placeholder="微信 / 手机 / 邮箱" required />
        </label>
        <label>想做什么
          <select name="type">
            <option>新店落地</option>
            <option>老店改造</option>
            <option>培训 / 陪跑</option>
            <option>先诊断看看</option>
          </select>
        </label>
        <label>简单说一下
          <textarea name="message" placeholder="城市、面积、品类、大致预算…随便写"></textarea>
        </label>
        <button class="btn" type="submit">发送需求</button>
        <p class="note">若邮件客户端打不开，直接加微信或发邮件到 hello@zhizao.cn 也行。</p>
      </form>
    </section>

    <footer>
      <div>© 2026 执造咨询 ZHIZAO</div>
      <div>厦门 · 门店落地咨询</div>
    </footer>
  </div>
</body>
</html>
